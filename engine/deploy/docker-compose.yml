# Lead engine + its own Postgres. The server runs Coolify; its Traefik proxy
# (coolify-proxy, also serving n8n.dulcy.io) routes ENGINE_HOST to the engine over
# HTTPS via the labels below, HQ_HOST (Dulcy HQ, the private web app) and PORTAL_HOST (the
# client portal, portal.dulcy.io) to the same container. Port 127.0.0.1:8090 stays for local health checks.
services:
  engine:
    # Built from the repo root so the image also holds the HQ web app (hq/web).
    build:
      context: ../..
      dockerfile: engine/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      # Key files (e.g. google-sa.json) live here on the server only; never in git.
      - ./secrets:/app/secrets:ro
      # Repo knowledge for the agents (client files, rules, skills); a git pull updates it, no rebuild.
      - ../../clients:/app/knowledge/clients:ro
      - ../../rules:/app/knowledge/rules:ro
      - ../../skills:/app/knowledge/skills:ro
    environment:
      DATABASE_URL: postgres://engine:${POSTGRES_PASSWORD}@db:5432/engine
      GOOGLE_IMPERSONATE_USER: ${GOOGLE_IMPERSONATE_USER:-scale@dulcy.io}
      HQ_HOST: ${HQ_HOST:-hq.dulcy.io}
      PORTAL_HOST: ${PORTAL_HOST:-portal.dulcy.io}
    ports:
      - "127.0.0.1:8090:8080"
    # n8n's network: reaches the calendar service (dulcy-calendar:8789) for client availability.
    networks: [default, coolify, n8n]
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.dulcy-engine.rule: "Host(`${ENGINE_HOST:-engine.dulcy.io}`)"
      traefik.http.routers.dulcy-engine.entrypoints: https
      traefik.http.routers.dulcy-engine.tls: "true"
      traefik.http.routers.dulcy-engine.tls.certresolver: letsencrypt
      traefik.http.services.dulcy-engine.loadbalancer.server.port: "8080"
      traefik.http.routers.dulcy-engine-http.rule: "Host(`${ENGINE_HOST:-engine.dulcy.io}`)"
      traefik.http.routers.dulcy-engine-http.entrypoints: http
      traefik.http.routers.dulcy-engine-http.middlewares: dulcy-engine-https
      traefik.http.middlewares.dulcy-engine-https.redirectscheme.scheme: https
      traefik.http.routers.dulcy-engine.service: dulcy-engine
      # Dulcy HQ: same container, its own host name and certificate.
      traefik.http.routers.dulcy-hq.rule: "Host(`${HQ_HOST:-hq.dulcy.io}`)"
      traefik.http.routers.dulcy-hq.entrypoints: https
      traefik.http.routers.dulcy-hq.tls: "true"
      traefik.http.routers.dulcy-hq.tls.certresolver: letsencrypt
      traefik.http.routers.dulcy-hq.service: dulcy-engine
      traefik.http.routers.dulcy-hq-http.rule: "Host(`${HQ_HOST:-hq.dulcy.io}`)"
      traefik.http.routers.dulcy-hq-http.entrypoints: http
      traefik.http.routers.dulcy-hq-http.middlewares: dulcy-engine-https
      # Client portal: same container, its own host name and certificate. The engine serves only the
      # portal shell and the portal + login APIs on this host (never HQ's app or the signed API).
      traefik.http.routers.dulcy-portal.rule: "Host(`${PORTAL_HOST:-portal.dulcy.io}`)"
      traefik.http.routers.dulcy-portal.entrypoints: https
      traefik.http.routers.dulcy-portal.tls: "true"
      traefik.http.routers.dulcy-portal.tls.certresolver: letsencrypt
      traefik.http.routers.dulcy-portal.service: dulcy-engine
      traefik.http.routers.dulcy-portal-http.rule: "Host(`${PORTAL_HOST:-portal.dulcy.io}`)"
      traefik.http.routers.dulcy-portal-http.entrypoints: http
      traefik.http.routers.dulcy-portal-http.middlewares: dulcy-engine-https
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: engine
      POSTGRES_DB: engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - engine-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine"]
      interval: 5s
      retries: 20
volumes:
  engine-db:
networks:
  coolify:
    external: true
  n8n:
    external: true
    name: jo00woww0kwo840gs0o08wgg
