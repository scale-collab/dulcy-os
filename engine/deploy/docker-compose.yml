# Lead engine + its own Postgres. The server runs Coolify; its Traefik proxy
# (coolify-proxy, also serving n8n.dulcy.io) routes ENGINE_HOST to the engine over
# HTTPS via the labels below. Port 127.0.0.1:8090 stays for local health checks.
services:
  engine:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      # Key files (e.g. google-sa.json) live here on the server only; never in git.
      - ./secrets:/app/secrets:ro
    environment:
      DATABASE_URL: postgres://engine:${POSTGRES_PASSWORD}@db:5432/engine
      GOOGLE_IMPERSONATE_USER: ${GOOGLE_IMPERSONATE_USER:-scale@dulcy.io}
    ports:
      - "127.0.0.1:8090:8080"
    networks: [default, coolify]
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.dulcy-engine.rule: "Host(`${ENGINE_HOST:-engine.dulcy.io}`)"
      traefik.http.routers.dulcy-engine.entrypoints: https
      traefik.http.routers.dulcy-engine.tls: "true"
      traefik.http.routers.dulcy-engine.tls.certresolver: letsencrypt
      traefik.http.services.dulcy-engine.loadbalancer.server.port: "8080"
      traefik.http.routers.dulcy-engine-http.rule: "Host(`${ENGINE_HOST:-engine.dulcy.io}`)"
      traefik.http.routers.dulcy-engine-http.entrypoints: http
      traefik.http.routers.dulcy-engine-http.middlewares: dulcy-engine-https
      traefik.http.middlewares.dulcy-engine-https.redirectscheme.scheme: https
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: engine
      POSTGRES_DB: engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - engine-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine"]
      interval: 5s
      retries: 20
volumes:
  engine-db:
networks:
  coolify:
    external: true
